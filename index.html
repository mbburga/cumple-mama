<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Feliz cumpleaños madre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Resplandor que ilumina toda la pantalla -->
  <div id="glow"></div>

  <!-- Partículas / chispas -->
  <div id="embers"></div>

  <main id="scene">

    <!-- Título (aparece al tocar la vela) -->
    <h1 id="title">
      <span class="line1">Feliz cumpleaños</span>
      <span class="line2">madre</span>
    </h1>

    <!-- La vela -->
    <button id="candle" aria-label="Tocar la vela">
      <div class="flame-wrap">
        <div class="flame"></div>
        <div class="flame-core"></div>
      </div>
      <div class="wick"></div>
      <div class="wax">
        <div class="drip d1"></div>
        <div class="drip d2"></div>
      </div>
    </button>

    <p id="hint">tócame</p>

    <!-- Mensaje de bienvenida -->
    <section id="welcome">
      <p class="msg">Hoy el mundo brilla un poquito más porque es tu día.</p>
      <p class="msg">Esta página es solo para ti. Prepárate, hay sorpresas esperándote.</p>
      <button id="enter">Descubrir mi sorpresa 🎁</button>
    </section>
  </main>

  <!-- Capas de efectos -->
  <div id="balloons"></div>
  <canvas id="confetti"></canvas>

  <!-- Sección: Bellos momentos -->
  <section id="moments" aria-label="Bellos momentos">
    <button id="back">← Volver</button>
    <h2>Bellos momentos</h2>

    <div class="gallery">
      <figure class="polaroid" style="--r:-5deg; --i:0">
        <img src="fotos/foto1.jpeg" alt="Foto 1" loading="lazy">
        <figcaption>Bellos momentos</figcaption>
      </figure>
      <figure class="polaroid" style="--r:4deg; --i:1">
        <img src="fotos/foto2.jpeg" alt="Foto 2" loading="lazy">
        <figcaption>Bellos momentos</figcaption>
      </figure>
      <figure class="polaroid" style="--r:3deg; --i:2">
        <img src="fotos/foto3.jpeg" alt="Foto 3" loading="lazy">
        <figcaption>Bellos momentos</figcaption>
      </figure>
      <figure class="polaroid" style="--r:-4deg; --i:3">
        <img src="fotos/foto4.jpeg" alt="Foto 4" loading="lazy">
        <figcaption>Bellos momentos</figcaption>
      </figure>
    </div>

    <p class="soon">Toca una foto para verla grande ✨</p>
  </section>

  <!-- Foto ampliada -->
  <div id="lightbox"><img alt=""></div>

  <script src="script.js"></script>
</body>
</html>
